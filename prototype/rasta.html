<title>Rasta Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,600;0,700;1,500&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ---------- tokens: light is the base, both dark states redefine only tokens ---------- */
:root{
  --ground:#F2F4F3; --surface:#FFFFFF; --surface-2:#F7F9F9; --surface-3:#EAEEEF;
  --ink:#101F29; --ink-2:#41545F; --ink-3:#6B7D87;
  --line:#D5DDE0; --line-strong:#B4C0C5;
  --brand:#123E82; --brand-2:#1462A8; --brand-ink:#FFFFFF;
  --tile:#17958E;
  --cat-seller:#1462A8; --cat-fee:#17958E; --cat-acq:#8A6BC4; --cat-ship:#C2792A;
  --good:#1B7F52; --good-bg:#E4F1EA; --warn:#A9701A; --warn-bg:#FBF0DC; --bad:#B0362C; --bad-bg:#FAE7E4;
  --shadow:0 1px 2px rgba(16,31,41,.06), 0 8px 24px -16px rgba(16,31,41,.28);
  --radius:10px;
  --f-display:"Bitter",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0B141C; --surface:#12212D; --surface-2:#172A38; --surface-3:#1F3646;
    --ink:#E6EEF3; --ink-2:#A8BCC8; --ink-3:#7D95A3;
    --line:#27404F; --line-strong:#36586C;
    --brand:#4C93DC; --brand-2:#3B86D0; --brand-ink:#08131B;
    --tile:#1FA98A;
    --cat-seller:#3B86D0; --cat-fee:#1FA98A; --cat-acq:#9B7BD8; --cat-ship:#BC8129;
    --good:#34B37A; --good-bg:#122E24; --warn:#D9A040; --warn-bg:#2E2413; --bad:#E2695C; --bad-bg:#31191A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0B141C; --surface:#12212D; --surface-2:#172A38; --surface-3:#1F3646;
  --ink:#E6EEF3; --ink-2:#A8BCC8; --ink-3:#7D95A3;
  --line:#27404F; --line-strong:#36586C;
  --brand:#4C93DC; --brand-2:#3B86D0; --brand-ink:#08131B;
  --tile:#1FA98A;
  --cat-seller:#3B86D0; --cat-fee:#1FA98A; --cat-acq:#9B7BD8; --cat-ship:#BC8129;
  --good:#34B37A; --good-bg:#122E24; --warn:#D9A040; --warn-bg:#2E2413; --bad:#E2695C; --bad-bg:#31191A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--brand-2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.muted{color:var(--ink-3)}.dim{color:var(--ink-2)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hidden{display:none!important}

/* ---------- top chrome ---------- */
.demo-strip{background:var(--brand);color:var(--brand-ink);font-size:12.5px}
.demo-strip .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-block:6px;flex-wrap:wrap}
.demo-strip b{font-weight:600}
header.top{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand-mark{width:30px;height:30px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--ink-3);line-height:1;margin-top:2px}
.search{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface-2);overflow:hidden}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 12px;color:var(--ink);font:inherit}
.search input:focus{outline:none}
.search button{border:0;background:var(--brand);color:var(--brand-ink);padding:0 16px;cursor:pointer;font-weight:600}
.tools{display:flex;align-items:center;gap:8px}
.chipbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chipbtn:hover{border-color:var(--brand-2)}
.chipbtn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.langs{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.langs button{border:0;background:var(--surface);padding:7px 9px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink-2)}
.langs button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.cartbtn{position:relative}
.cartbtn .badge{position:absolute;top:-7px;right:-7px;background:var(--cat-ship);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-mono)}
nav.main{border-top:1px solid var(--line);background:var(--surface-2)}
nav.main .wrap{display:flex;gap:2px;overflow-x:auto}
nav.main a{padding:10px 12px;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
nav.main a:hover{color:var(--ink);text-decoration:none}
nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand-2);font-weight:600}

main{padding:28px 0 56px}
section.block{margin-bottom:40px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.section-head h2{font-size:24px}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.panel.flat{box-shadow:none}
.panel.lift{box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:700;letter-spacing:-.03em;display:block;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--ink-3);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill.good{background:var(--good-bg);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.pill.neutral{background:var(--surface-3);color:var(--ink-2);border-color:var(--line)}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand-2);border-color:var(--line-strong)}
.btn.ghost:hover{border-color:var(--brand-2);filter:none}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2)}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;width:100%}
textarea{min-height:70px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* ---------- money split bar (the recurring device) ---------- */
.splitbar{display:flex;gap:2px;height:14px;border-radius:3px;overflow:hidden;background:var(--surface-3)}
.splitbar > span{display:block;border-radius:2px}
.splitbar > span:first-child{border-radius:3px 2px 2px 3px}
.splitbar > span:last-child{border-radius:2px 3px 3px 2px}
.split-legend{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px;font-size:12.5px}
.split-legend .li{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.swatch{width:10px;height:10px;border-radius:2px;flex:none}
.receipt{width:100%;font-size:13.5px}
.receipt td{padding:6px 0;border-bottom:1px dashed var(--line)}
.receipt tr.total td{border-top:1px solid var(--line-strong);border-bottom:0;padding-top:9px;font-weight:700}
.receipt td:last-child{text-align:right;white-space:nowrap}
.tip{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:var(--shadow);pointer-events:none;max-width:230px}

/* ---------- product cards ---------- */
.grid-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--line-strong)}
.card .art{aspect-ratio:4/3;background:var(--surface-3);display:block;width:100%}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .name{font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.35}
.card .name:hover{color:var(--brand-2);text-decoration:none}
.price{font-family:var(--f-mono);font-weight:700;font-size:17px;letter-spacing:-.03em}
.card .seller{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.verified{color:var(--good);font-weight:600;font-size:12px}
.deliv{font-size:12.5px;color:var(--ink-2)}
.why{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:12px;text-decoration:underline dotted;padding:0;text-align:left}
.card .foot{display:flex;gap:8px;align-items:center;margin-top:auto}

/* ---------- layout helpers ---------- */
.split-2{display:grid;grid-template-columns:1.55fr 1fr;gap:24px;align-items:start}
.split-side{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
@media (max-width:900px){.split-2,.split-side{grid-template-columns:1fr}}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;position:relative;overflow:hidden}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:22px}}
.hero h1{font-size:34px;letter-spacing:-.02em}
.hero .lead{color:var(--ink-2);font-size:16px;max-width:56ch;margin-top:12px}
.hero-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.fact{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.tilepattern{position:absolute;inset:auto -40px -60px auto;width:280px;opacity:.14;pointer-events:none}

/* ---------- misc components ---------- */
.steps{counter-reset:s;display:grid;gap:10px}
.step{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:700}
.step.done .n{background:var(--good);color:#fff}
.step.now .n{background:var(--brand);color:var(--brand-ink)}
.timeline{display:grid;gap:0}
.tl{display:grid;grid-template-columns:16px 1fr;gap:12px}
.tl .dot{position:relative;display:flex;justify-content:center}
.tl .dot i{width:10px;height:10px;border-radius:50%;background:var(--line-strong);margin-top:6px;display:block}
.tl.done .dot i{background:var(--good)}
.tl.now .dot i{background:var(--brand-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand-2) 22%,transparent)}
.tl .dot::before{content:"";position:absolute;top:16px;bottom:-6px;width:2px;background:var(--line)}
.tl:last-child .dot::before{display:none}
.tl .txt{padding-bottom:14px}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;font-size:13px}
.bar-track{display:block;background:var(--surface-3);border-radius:4px;height:12px;overflow:hidden}
.bar-fill{display:block;height:12px;border-radius:4px;background:var(--brand-2)}
.bar-row.hl .bar-fill{background:var(--good)}
.bar-row.hl{font-weight:600}
.note{font-size:12.5px;color:var(--ink-3)}
.callout{border-left:3px solid var(--brand-2);background:var(--surface-2);padding:12px 14px;border-radius:0 8px 8px 0;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 13px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand-2);font-weight:600}
.order-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.order-card > header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.order-card .inner{padding:16px}
.shipment{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface)}
.thumb{width:56px;height:56px;border-radius:6px;flex:none;background:var(--surface-3)}
.li-item{display:flex;gap:12px;align-items:flex-start}
.checkbox{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.checkbox input{margin-top:3px}
dialog{border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(6,16,24,.55)}
dialog .dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
dialog .dlg-body{padding:18px}
footer.site{border-top:1px solid var(--line);background:var(--surface);padding:26px 0 40px;font-size:13px;color:var(--ink-2)}
footer.site .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:24px}
@media (max-width:760px){footer.site .cols{grid-template-columns:1fr}}
@media (max-width:760px){
  .topbar{grid-template-columns:1fr auto;row-gap:10px}
  .search{grid-column:1/-1;order:3}
  .hero h1{font-size:27px}
  .bar-row{grid-template-columns:110px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="demo-strip"><div class="wrap">
  <span id="demoNote"></span>
  <button class="chipbtn" id="resetDemo" style="background:transparent;color:inherit;border-color:currentColor"></button>
</div></div>

<header class="top">
  <div class="wrap topbar">
    <a class="brand" href="#/" data-nav>
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="7" fill="var(--brand)"></rect>
        <path d="M20 7l13 13-13 13L7 20z" fill="none" stroke="var(--brand-ink)" stroke-width="2"></path>
        <path d="M20 13.5l6.5 6.5-6.5 6.5-6.5-6.5z" fill="var(--tile)"></path>
      </svg>
      <span>
        <span class="brand-name">Rasta</span>
        <span class="brand-sub" id="brandSub"></span>
      </span>
    </a>
    <form class="search" id="searchForm" role="search">
      <input type="text" id="q" autocomplete="off">
      <button type="submit" id="searchBtn"></button>
    </form>
    <div class="tools">
      <select id="city" style="width:auto;padding:7px 8px;font-size:13px"></select>
      <div class="langs" role="group" aria-label="Language">
        <button data-lang="ru" type="button">RU</button>
        <button data-lang="uz" type="button">UZ</button>
        <button data-lang="en" type="button">EN</button>
      </div>
      <a class="chipbtn cartbtn" href="#/cart" data-nav id="cartLink">🛒 <span class="cart-label"></span><span class="badge hidden" id="cartCount">0</span></a>
    </div>
  </div>
  <nav class="main"><div class="wrap" id="nav"></div></nav>
</header>

<main><div class="wrap" id="view"></div></main>

<footer class="site"><div class="wrap cols" id="footer"></div></footer>

<dialog id="dlg"><div class="dlg-head"><h3 id="dlgTitle" style="font-size:17px"></h3><button class="chipbtn" id="dlgClose" aria-label="Close">✕</button></div><div class="dlg-body" id="dlgBody"></div></dialog>
<div class="tip hidden" id="tip" role="status"></div>

<script>
"use strict";
/* =========================================================================
   Rasta — демонстрационный прототип маркетплейса по ТЗ v1.0
   Модель: складов оператора нет, товар у продавца, платёж расщепляется
   и доля продавца уходит на его счёт напрямую.
   ========================================================================= */

const DICT = {

    only_verified:"Только проверенные продавцы", fast_only:"Доставка ≤ 2 дней", sort:"Сортировка",
    sort_rank:"По ранжированию", sort_price_asc:"Сначала дешевле", sort_price_desc:"Сначала дороже", sort_fast:"Быстрее доставят",

function deliveryDays(sellerRegion, city, carrierKey){
  if(carrierKey === "psu") return 0;
  const c = CARRIERS[carrierKey] || CARRIERS.bts;
  let extra = 0;
  if(sellerRegion !== city) extra = (NEAR[city]||[]).includes(sellerRegion) ? 1 : 2;
  return c.days + extra;
}
function deliveryCost(vol, carrierKey, sellerRegion, city){
  const c = CARRIERS[carrierKey] || CARRIERS.bts;
  if(carrierKey === "psu") return 0;
  if(carrierKey === "sds" && sellerRegion !== city) return 0;
  const far = sellerRegion === city ? 1 : ((NEAR[city]||[]).includes(sellerRegion) ? 1.15 : 1.35);
  return Math.round((c.base + c.perL * vol) * far / 500) * 500;
}
function carriersFor(sellerId, vol, city){
  const s = SELLERS[sellerId];
  const keys = [];
  if(s.models.includes("crs")) keys.push("bts","fargo");
  if(s.models.includes("post")) keys.push("post");
  if(s.models.includes("sds") && s.region === city) keys.push("sds");
  if(s.models.includes("psu") && s.region === city) keys.push("psu");
  if(!keys.length) keys.push("bts");
  return keys.map(k => ({key:k, name:loc(CARRIERS[k].name), cost:deliveryCost(vol,k,s.region,city), days:deliveryDays(s.region,city,k)}));
}
function bestCarrier(sellerId, vol, city){
  const list = carriersFor(sellerId, vol, city).filter(c => c.key !== "psu");
  return list.sort((a,b) => (a.days - b.days) || (a.cost - b.cost))[0] || carriersFor(sellerId,vol,city)[0];
}
/* the split, exactly as in TZ §19.3 */
function splitOf(goods, delivery, cat){
  const commission = Math.round(goods * feeOf(cat));
  const acquiring = Math.round((goods + delivery) * 0.01);
  const sellerGets = goods - commission - acquiring;
  return {goods, delivery, commission, acquiring, sellerGets, total: goods + delivery};
}

/* stacked proportional split bar — the recurring device */
function splitBar(sp, opts){
  opts = opts || {};
  const segs = [
    {k:"seg_seller", v:sp.sellerGets, c:"var(--cat-seller)"},
    {k:"seg_fee", v:sp.commission, c:"var(--cat-fee)"},
    {k:"seg_acq", v:sp.acquiring, c:"var(--cat-acq)"},
    {k:"seg_ship", v:sp.delivery, c:"var(--cat-ship)"}
  ].filter(s => s.v > 0);
  const total = segs.reduce((a,s) => a + s.v, 0) || 1;
  const bar = `<div class="splitbar" role="img" aria-label="${esc(t("money_h"))}">` + segs.map(s =>
    `<span style="flex:${(s.v/total).toFixed(4)};background:${s.c}" data-tip="${esc(t(s.k))}: ${esc(money(s.v))} · ${esc(((s.v/total)*100).toFixed(1).replace(".",","))} %"></span>`).join("") + `</div>`;
  const legend = opts.legend === false ? "" : `<div class="split-legend">` + segs.map(s =>
    `<span class="li"><i class="swatch" style="background:${s.c}"></i>${esc(t(s.k))} <b class="num">${esc(fmt(s.v))}</b></span>`).join("") + `</div>`;
  return bar + legend;
}

function barChart(rows, opts){
  opts = opts || {};

  return `<div class="bars">` + rows.map(r => `
    <div class="bar-row${r.hl ? " hl" : ""}">

    </div>`).join("") + `</div>` + (opts.note ? `<p class="note" style="margin-top:10px">${esc(opts.note)}</p>` : "");
}

/* ---------------------------- ranking ---------------------------- */
function score(p, q){
  const s = SELLERS[p.s];
  const car = bestCarrier(p.s, p.vol, S.city);
  const days = car ? car.days : 3;
  const rel = q ? (loc(p.n).toLowerCase().includes(q) ? 1 : 0.35) : 0.8;
  const f = {
    f_relevance: rel,
    f_delivery: Math.max(0, 1 - (days - 1) / 6),
    f_rating: (s.rating - 4) / 1,
    f_sla: s.sla / 100,
    f_price: Math.max(0, 1 - (p.price + (car ? car.cost : 0)) / 5000000),
    f_conv: Math.min(1, p.conv / 10)
  };
  let total = 0; RANK_WEIGHTS.forEach(([k,w]) => total += f[k] * w);
  return {total, f, days, car};
}
function visibleProducts(){
  const q = (S.q || "").trim().toLowerCase();
  let list = allProducts().filter(p => !S.unpublished.includes(p.id));
  if(q) list = list.filter(p => (loc(p.n) + " " + loc(SELLERS[p.s].name) + " " + loc(CATS[p.cat])).toLowerCase().includes(q));
  const F = S.filters;
  if(F.cat) list = list.filter(p => p.cat === F.cat);
  if(F.region) list = list.filter(p => SELLERS[p.s].region === F.region);
  if(F.pmin) list = list.filter(p => p.price >= Number(F.pmin));
  if(F.pmax) list = list.filter(p => p.price <= Number(F.pmax));
  if(F.verified) list = list.filter(p => SELLERS[p.s].verified);
  const scored = list.map(p => ({p, sc:score(p, q)}));
  const out = F.fast ? scored.filter(x => x.sc.days <= 2) : scored;
  if(F.sort === "price_asc") out.sort((a,b) => a.p.price - b.p.price);
  else if(F.sort === "price_desc") out.sort((a,b) => b.p.price - a.p.price);
  else if(F.sort === "fast") out.sort((a,b) => a.sc.days - b.sc.days || b.sc.total - a.sc.total);
  else out.sort((a,b) => b.sc.total - a.sc.total);
  return out;
}

/* ---------------------------- orders ---------------------------- */
const FLOW = ["paid","confirmed","packed","handed","transit","delivered","done"];
function statusPill(st){
  const map = {paid:"neutral",confirmed:"neutral",packed:"neutral",handed:"neutral",transit:"warn",delivered:"warn",done:"good",disputed:"bad"};
  return `<span class="pill ${map[st]||"neutral"}">${esc(t("st_" + st))}</span>`;
}
function orderCard(o, asSeller, onlySeller){
  return o.groups.map((g, gi) => {
    if(onlySeller && g.seller !== onlySeller) return "";
    const s = SELLERS[g.seller];
    const done = FLOW.indexOf(g.status);
    const tl = FLOW.slice(0, Math.max(1, done + 1)).map((k,i) => {
      const ev = g.events.find(e => e.k === k);
      return `<div class="tl ${i < done ? "done" : "now"}"><span class="dot"><i></i></span>
        <span class="txt"><b>${esc(t("st_" + k))}</b>${ev ? `<span class="muted num" style="display:block;font-size:12px">${esc(dstr(ev.at))} ${esc(tstr(ev.at))}</span>` : ""}</span></div>`;
    }).reverse().join("");
    const acts = [];
    if(asSeller){
      if(g.status === "paid") acts.push(`<button class="btn small" data-act="confirm:${o.id}:${gi}">${esc(t("confirm_order"))}</button>`);
      if(g.status === "confirmed") acts.push(`<button class="btn small" data-act="pack:${o.id}:${gi}">${esc(t("pack"))}</button>`);
      if(g.status === "packed") acts.push(`<button class="btn small" data-act="hand:${o.id}:${gi}">${esc(t("hand_carrier"))}</button>`);
    } else {
      if(["paid","confirmed","packed","handed","transit"].includes(g.status)) acts.push(`<button class="btn ghost small" data-act="advance:${o.id}:${gi}">${esc(t("advance"))}</button>`);
      if(g.status === "delivered") acts.push(`<button class="btn small" data-act="receipt:${o.id}:${gi}">${esc(t("confirm_receipt"))}</button>`);
      if(["delivered","done"].includes(g.status) && !g.dispute) acts.push(`<button class="btn ghost small" data-act="dispute:${o.id}:${gi}">${esc(t("open_dispute"))}</button>`);
      if(g.dispute && !g.dispute.decided) acts.push(`<button class="btn small" data-act="decide:${o.id}:${gi}">${esc(t("d_decided"))} (demo)</button>`);
    }
    const payout = g.dispute && g.dispute.refunded
      ? `<span class="pill bad">${esc(t("op_refund"))}</span>`
      : g.payoutAt ? `<span class="pill good">✓ ${esc(t("payout_released"))} · <span class="num">${esc(dstr(g.payoutAt))} ${esc(tstr(g.payoutAt))}</span></span>`
      : `<span class="pill warn">${esc(t("k_hold"))}</span>`;
    return `<article class="order-card">
      <header>
        <span><b>${esc(t("order"))} ${esc(o.id)}</b> <span class="muted num">${esc(t("from"))} ${esc(dstr(o.at))}</span></span>
        <span class="row gap8" style="flex-wrap:wrap">${statusPill(g.dispute && !g.dispute.decided ? "disputed" : g.status)} ${payout}</span>
      </header>
      <div class="inner split-2" style="gap:20px">
        <div class="stack gap12">
          <div>${sellerLine(g.seller)}</div>
          ${g.items.map(i => { const p = productById(i.id); return `<div class="li-item">
            <span class="thumb" style="overflow:hidden">${p ? art(p.art, p.price % 4) : ""}</span>
            <span style="flex:1">${p ? esc(loc(p.n)) : i.id}<span class="muted" style="display:block;font-size:12.5px">${i.qty} ${esc(t("pcs"))} · <span class="num">${esc(money(i.price*i.qty))}</span></span></span>
          </div>`; }).join("")}
          <div class="note">${esc(t("carrier"))}: ${esc(g.carrier.name)} · ${esc(t("track"))} <span class="num">${esc(g.tracking)}</span> · ${esc(loc(SELLERS[g.seller].city))} → ${esc(loc(REGIONS[o.city]))}</div>
          ${g.dispute ? `<div class="callout"><b>${esc(t("dispute"))}:</b> ${esc(g.dispute.reason)}<br>
            <span class="note">${g.dispute.decided ? esc(t("d_decided")) + " — " + esc(t("d_refund")) : esc(t("d_step2"))}</span></div>` : ""}
          <div class="row gap8" style="flex-wrap:wrap">${acts.join("")}</div>
        </div>
        <div>
          <span class="eyebrow">${esc(t("money_way"))}</span>
          <div style="margin:10px 0">${splitBar(g.split, {legend:false})}</div>
          ${splitReceipt(g.split, g.cat)}
          <div class="timeline" style="margin-top:16px">${tl}</div>
        </div>
      </div>
    </article>`;
  }).join("");
}

        <h1 style="margin-top:10px">${esc(t("fs_h"))}</h1>
        <p class="lead">${esc(t("fs_p"))}</p>
        <div class="row gap12" style="margin-top:18px;flex-wrap:wrap">
          <a class="btn" href="#/seller" data-nav>${esc(t("seller_cab"))}</a>
          <a class="btn ghost" href="#/transparency" data-nav>${esc(t("t_tariffs"))}</a>
        </div>
      </div>
      <div class="panel" style="background:var(--surface-2)">
        <span class="eyebrow">${esc(t("fs_calc"))}</span>
        <label class="field" style="margin:12px 0">${esc(t("price_label"))}
          <input type="number" id="fsPrice" value="${price}" min="10000" step="50000"></label>
        <label class="field">${esc(t("p_cat"))}
          <select id="fsCat">${Object.keys(CATS).map(k => `<option value="${k}"${k===cat?" selected":""}>${esc(loc(CATS[k]))} · ${esc(pct(CATS[k].fee,1))}</option>`).join("")}</select></label>
        <div id="fsOut" style="margin-top:16px">${barChart(cmp, {note:t("fs_classic_note")})}</div>
      </div>
    </section>
    <section class="block">
      <div class="section-head"><h2>${esc(t("fs_compare"))}</h2></div>
      <div class="panel" style="padding:0;overflow:hidden"><div class="scroll-x"><table>
        <thead><tr><th></th><th>${esc(t("fs_classic"))}</th><th>Rasta</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r[0])}</td><td class="muted">${esc(r[1])}</td><td><b>${esc(r[2])}</b></td></tr>`).join("")}</tbody>
      </table></div></div>
    </section>`;
}
</script>

<script>
"use strict";
/* ---------------------------- dialog & tooltip ---------------------------- */
const dlg = document.getElementById("dlg");
function openDialog(title, html, onMount){
  document.getElementById("dlgTitle").textContent = title;
  const body = document.getElementById("dlgBody");
  body.innerHTML = html;
  if(!dlg.open) dlg.showModal();
  if(onMount) onMount(body);
}
document.getElementById("dlgClose").addEventListener("click", () => dlg.close());
const tipEl = document.getElementById("tip");
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  if(!el){ tipEl.classList.add("hidden"); return; }
  tipEl.textContent = el.getAttribute("data-tip");
  tipEl.classList.remove("hidden");
});
document.addEventListener("mousemove", (e) => {
  if(tipEl.classList.contains("hidden")) return;
  const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  tipEl.style.left = Math.min(window.innerWidth - w - 8, e.clientX + pad) + "px";
  tipEl.style.top = Math.max(8, e.clientY - h - pad) + "px";
});

/* ---------------------------- cart & orders ---------------------------- */
function addToCart(id){
  const line = S.cart.find(c => c.id === id);
  if(line) line.qty++; else S.cart.push({id, qty:1});
  save(); renderAll();
}
function eligibleInstant(sellerId){ const s = SELLERS[sellerId]; return s.rating >= 4.6 && s.disp <= 1; }
function pushLedger(entries){ S.ledger = S.ledger.concat(entries); }
function releasePayout(o, g){
  if(g.payoutAt) return;
  g.payoutAt = Date.now();
  if(g.seller === MY_SHOP){
    pushLedger([
      {at:g.payoutAt, order:o.id, kind:"sale", amount:g.split.goods, tariff:TARIFF.current.v},
      {at:g.payoutAt, order:o.id, kind:"fee", amount:-g.split.commission, tariff:TARIFF.current.v},
      {at:g.payoutAt, order:o.id, kind:"acq", amount:-g.split.acquiring, tariff:TARIFF.current.v}
    ]);
  }
}
function createOrder(form){
  const gs = cartGroups();
  const settle = form.settle;
  const groups = gs.map(g => {
    const instant = settle === "instant" && eligibleInstant(g.sid);
    return {
      seller:g.sid, cat:g.cat, items:g.items.map(i => ({id:i.p.id, qty:i.qty, price:i.p.price})),
      carrier:{key:g.car.key, name:loc(CARRIERS[g.car.key].name), cost:g.car.cost, days:g.car.days},
      split:g.split, status:"paid", events:[{k:"paid", at:Date.now()}],
      tracking:"UZ" + Math.floor(1e8 + Math.random()*9e8), packed:{photo:false, video:false},
      payoutAt: instant ? Date.now() : null, dispute:null, instant
    };
  });
  const o = {id:"R-" + String(100000 + Math.floor(Math.random()*899999)), at:Date.now(), city:form.city,
    address:form.addr, name:form.name, phone:form.phone, pay:form.pay, settle, groups};
  groups.forEach(g => { if(g.payoutAt && g.seller === MY_SHOP){
    pushLedger([
      {at:g.payoutAt, order:o.id, kind:"sale", amount:g.split.goods, tariff:TARIFF.current.v},
      {at:g.payoutAt, order:o.id, kind:"fee", amount:-g.split.commission, tariff:TARIFF.current.v},
      {at:g.payoutAt, order:o.id, kind:"acq", amount:-g.split.acquiring, tariff:TARIFF.current.v}
    ]);
  }});
  S.orders.unshift(o); S.cart = []; save();
  location.hash = "#/orders";
  renderAll();
  openDialog(t("order_placed"), `<p class="dim" style="margin-bottom:14px">${esc(t("order_placed_p"))}</p>
    ${groups.map(g => `<div style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap">
        <b>${esc(loc(SELLERS[g.seller].name))}</b>
        <span class="pill ${g.payoutAt ? "good" : "warn"}">${esc(g.payoutAt ? t("payout_released") : t("payout_pending"))}</span>
      </div>
      <div style="margin:10px 0">${splitBar(g.split)}</div>
    </div>`).join("")}
    <p class="note">${esc(t("order"))} ${esc(o.id)} · ${esc(t("settle"))}: ${esc(settle === "instant" ? t("settle_instant") : t("settle_hold"))}</p>`);
}
function findGroup(oid, gi){
  const o = S.orders.find(x => x.id === oid);
  return o ? {o, g:o.groups[Number(gi)]} : {};
}
function stamp(g, k){ if(!g.events.some(e => e.k === k)) g.events.push({k, at:Date.now()}); g.status = k; }

function actOn(cmd){
  const [act, oid, gi] = cmd.split(":");
  const {o, g} = findGroup(oid, gi);
  if(!o || !g) return;
  if(act === "confirm"){ stamp(g, "confirmed"); save(); renderAll(); return; }
  if(act === "pack"){
    openDialog(t("pack_h"), `<p class="dim" style="margin-bottom:14px">${esc(t("pack_p"))}</p>
      <div class="stack gap8">
        <label class="checkbox"><input type="checkbox" id="pkPhoto">${esc(t("pack_photo"))}</label>
        <label class="checkbox"><input type="checkbox" id="pkVideo">${esc(t("pack_video"))}</label>
      </div>
      <p class="note" style="margin-top:12px">${esc(t("track"))}: <span class="num">${esc(g.tracking)}</span></p>
      <div class="row gap8" style="margin-top:18px"><button class="btn" id="pkOk" disabled>${esc(t("pack"))}</button>
      <button class="btn ghost" id="pkCancel">${esc(t("cancel"))}</button></div>`, (body) => {
      const ph = body.querySelector("#pkPhoto"), vi = body.querySelector("#pkVideo"), ok = body.querySelector("#pkOk");
      const upd = () => { ok.disabled = !ph.checked; };
      ph.addEventListener("change", upd); vi.addEventListener("change", upd);
      body.querySelector("#pkCancel").addEventListener("click", () => dlg.close());
      ok.addEventListener("click", () => {
        g.packed = {photo:ph.checked, video:vi.checked};
        stamp(g, "packed"); save(); dlg.close(); renderAll();
      });
    });
    return;
  }
  if(act === "hand"){
    const vol = g.items.reduce((a,i) => { const p = productById(i.id); return a + (p ? p.vol * i.qty : 0); }, 0);
    const list = carriersFor(g.seller, vol, o.city).filter(c => c.key !== "psu");
    openDialog(t("choose_carrier"), `<div class="scroll-x"><table>
        <thead><tr><th>${esc(t("carrier"))}</th><th>${esc(t("term"))}</th><th>${esc(t("price_word"))}</th><th></th></tr></thead>
        <tbody>${list.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(daysWord(c.days))}</td><td class="num">${esc(money(c.cost))}</td>
          <td><button class="btn small" data-carrier="${c.key}">${esc(t("pick"))}</button></td></tr>`).join("")}</tbody></table></div>
      <p class="note" style="margin-top:12px">${esc(t("label_print"))} · ${esc(t("track"))} <span class="num">${esc(g.tracking)}</span></p>`, (body) => {
      body.querySelectorAll("[data-carrier]").forEach(btn => btn.addEventListener("click", () => {
        const key = btn.getAttribute("data-carrier");
        const c = list.find(x => x.key === key);
        g.carrier = {key, name:c.name, cost:c.cost, days:c.days};
        stamp(g, "handed"); save(); dlg.close(); renderAll();
      }));
    });
    return;
  }
  if(act === "advance"){
    const i = FLOW.indexOf(g.status);
    if(i >= 0 && i < FLOW.indexOf("delivered")) stamp(g, FLOW[i+1]);
    save(); renderAll(); return;
  }
  if(act === "receipt"){
    stamp(g, "done"); releasePayout(o, g); save(); renderAll();
    openDialog(t("payout_released"), `<p class="dim" style="margin-bottom:14px">${esc(t("settle_hold_d"))}</p>
      ${splitBar(g.split)}
      <p class="note" style="margin-top:14px">${esc(t("seller_gets"))}: <b class="num">${esc(money(g.split.sellerGets))}</b> · ${esc(t("released_at"))} ${esc(dstr(g.payoutAt))} ${esc(tstr(g.payoutAt))}</p>`);
    return;
  }
  if(act === "dispute"){
    openDialog(t("dispute_h"), `<p class="dim" style="margin-bottom:14px">${esc(t("dispute_p"))}</p>
      <div class="steps" style="margin-bottom:16px">${[1,2,3,4].map(i => `<div class="step"><span class="n">${i}</span><span>${esc(t("d_step"+i))}</span></div>`).join("")}</div>
      <label class="field">${esc(t("d_reason"))}<textarea id="dpReason" placeholder="${esc(t("d_reason_ph"))}"></textarea></label>
      <label class="checkbox" style="margin-top:10px"><input type="checkbox" id="dpEv">${esc(t("d_evidence"))}</label>
      <div class="row gap8" style="margin-top:18px"><button class="btn" id="dpOk">${esc(t("d_send"))}</button>
      <button class="btn ghost" id="dpCancel">${esc(t("cancel"))}</button></div>`, (body) => {
      body.querySelector("#dpCancel").addEventListener("click", () => dlg.close());
      body.querySelector("#dpOk").addEventListener("click", () => {
        const reason = (body.querySelector("#dpReason").value || t("d_reason_ph")).slice(0,200);
        g.dispute = {reason, at:Date.now(), evidence:body.querySelector("#dpEv").checked, decided:false, refunded:false};
        save(); dlg.close(); renderAll();
      });
    });
    return;
  }
  if(act === "decide"){
    g.dispute.decided = true; g.dispute.refunded = true;
    if(g.seller === MY_SHOP && g.payoutAt){
      pushLedger([
        {at:Date.now(), order:o.id, kind:"refund", amount:-g.split.sellerGets, tariff:TARIFF.current.v},
        {at:Date.now(), order:o.id, kind:"fee", amount:g.split.commission, tariff:TARIFF.current.v}
      ]);
    }
    save(); renderAll();
    openDialog(t("d_decided"), `<p class="dim">${esc(t("d_refund"))}</p>
      <p class="note" style="margin-top:12px">${esc(t("order"))} ${esc(o.id)} · ${esc(t("amount"))}: <b class="num">${esc(money(g.split.total))}</b></p>`);
    return;
  }
}

/* ---------------------------- product form & export ---------------------------- */
function addProductDialog(){
  openDialog(t("add_product"), `
    <div class="stack gap12">
      <label class="field">${esc(t("p_name"))}<input type="text" id="npName" value="Курта из адраса, ручной пошив"></label>
      <div class="row gap12">
        <label class="field" style="flex:1">${esc(t("p_cat"))}
          <select id="npCat">${Object.keys(CATS).map(k => `<option value="${k}">${esc(loc(CATS[k]))} · ${esc(pct(CATS[k].fee,1))}</option>`).join("")}</select></label>
        <label class="field" style="flex:1">${esc(t("p_vol"))}<input type="number" id="npVol" value="4" min="1"></label>
      </div>
      <label class="field">${esc(t("price_label"))}<input type="number" id="npPrice" value="450000" step="10000" min="10000"></label>
      <div class="panel flat" style="background:var(--surface-2)">
        <span class="eyebrow">${esc(t("calc"))}</span>
        <div id="npCalc" style="margin-top:10px"></div>
      </div>
      <div class="row gap8"><button class="btn" id="npOk">${esc(t("publish"))}</button>
      <button class="btn ghost" id="npCancel">${esc(t("cancel"))}</button></div>
    </div>`, (body) => {
    const price = body.querySelector("#npPrice"), cat = body.querySelector("#npCat"), calc = body.querySelector("#npCalc");
    const upd = () => {
      const sp = splitOf(Math.max(0, Number(price.value) || 0), 0, cat.value);
      calc.innerHTML = splitBar(sp) + splitReceipt(sp, cat.value);
    };
    price.addEventListener("input", upd); cat.addEventListener("change", upd); upd();
    body.querySelector("#npCancel").addEventListener("click", () => dlg.close());
    body.querySelector("#npOk").addEventListener("click", () => {
      const nm = body.querySelector("#npName").value.trim() || "Новый товар";
      const p = {id:uid("np"), s:MY_SHOP, cat:cat.value, price:Math.max(10000, Number(price.value)||10000),
        vol:Math.max(1, Number(body.querySelector("#npVol").value)||1), rate:5, rev:0, conv:5, art:2,
        n:{ru:nm, uz:nm, en:nm}, d:{ru:"Товар добавлен в демо-режиме.", uz:"Mahsulot demo rejimida qo'shildi.", en:"Added in demo mode."}};
      S.extraProducts.push(p); save(); dlg.close(); renderAll();
    });
  });
}
async function setupExport(){
  const btn = document.getElementById("exportCsv");
  if(!btn || !window.claude || !window.claude.use) return;
  let dl = null;
  try{ dl = await claude.use("downloads"); }catch(e){ dl = null; }
  if(!dl) return;
  btn.classList.remove("hidden");
  btn.addEventListener("click", async () => {
    const head = ["date","order","operation","amount","tariff"].join(";");
    const kindName = {sale:t("op_sale"), fee:t("op_fee"), acq:t("op_acq"), ship:t("op_ship"), refund:t("op_refund")};
    const body = S.ledger.slice().sort((a,b) => b.at - a.at)
      .map(r => [dstr(r.at), r.order, kindName[r.kind] || r.kind, r.amount, r.tariff].join(";")).join("\n");
    try{ await dl.save({filename:"rasta-ledger.csv", data:"﻿" + head + "\n" + body}); }catch(e){}
  });
}

/* ---------------------------- chrome & router ---------------------------- */
const ROUTES = [["#/", "nav_home"],["#/catalog","nav_catalog"],["#/orders","nav_orders"],["#/seller","nav_seller"],["#/transparency","nav_transparency"],["#/for-sellers","nav_forsellers"]];
function renderChrome(){
  document.documentElement.lang = S.lang;
  document.getElementById("demoNote").innerHTML = t("demo");
  document.getElementById("resetDemo").textContent = t("reset");
  document.getElementById("brandSub").textContent = t("tagline");
  const q = document.getElementById("q");
  q.placeholder = t("search"); q.value = S.q || "";
  document.getElementById("searchBtn").textContent = t("searchBtn");
  document.querySelector("#cartLink .cart-label").textContent = t("cart");
  const count = S.cart.reduce((a,c) => a + c.qty, 0);
  const badge = document.getElementById("cartCount");
  badge.textContent = count; badge.classList.toggle("hidden", count === 0);
  const city = document.getElementById("city");
  city.innerHTML = CITIES.map(c => `<option value="${c}"${c === S.city ? " selected" : ""}>${esc(loc(REGIONS[c]))}</option>`).join("");
  city.title = t("city");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  const route = currentRoute();
  document.getElementById("nav").innerHTML = ROUTES.map(([h,k]) =>
    `<a href="${h}" data-nav${route === h ? ' aria-current="page"' : ""}>${esc(t(k))}</a>`).join("");
  document.getElementById("footer").innerHTML = `
    <div>
      <div class="brand" style="margin-bottom:10px"><span class="brand-name">Rasta</span></div>
      <p>${esc(t("footer_p"))}</p>
      <p class="note" style="margin-top:8px">${esc(t("tagline"))} · Toshkent, 2026</p>
    </div>
    <div><b style="display:block;margin-bottom:8px">${esc(t("f_principles"))}</b>
      <p>${esc(t("f_p1"))}</p><p>${esc(t("f_p2"))}</p><p>${esc(t("f_p3"))}</p><p>${esc(t("f_p4"))}</p></div>
    <div><b style="display:block;margin-bottom:8px">${esc(t("f_docs"))}</b>
      <p>${esc(t("f_tz"))}</p><p>${esc(t("f_research"))}</p><p>${esc(t("f_offer"))} · ${esc(TARIFF.current.from)}</p></div>`;
}
function currentRoute(){
  const h = location.hash || "#/";
  if(h.startsWith("#/p/")) return "#/catalog";
  return h.split("?")[0];
}
function renderView(){
  const h = location.hash || "#/";
  const [path, query] = h.split("?");
  if(query){
    const qp = new URLSearchParams(query);
    if(qp.get("region")){ S.filters.region = qp.get("region"); }
  }
  const view = document.getElementById("view");
  if(path.startsWith("#/p/")) view.innerHTML = viewProduct(path.slice(4));
  else if(path === "#/catalog") view.innerHTML = viewCatalog();
  else if(path === "#/cart") view.innerHTML = viewCart();
  else if(path === "#/checkout") view.innerHTML = viewCheckout();
  else if(path === "#/orders") view.innerHTML = viewOrders();
  else if(path === "#/seller") view.innerHTML = viewSeller();
  else if(path === "#/transparency") view.innerHTML = viewTransparency();
  else if(path === "#/for-sellers") view.innerHTML = viewForSellers();
  else view.innerHTML = viewHome();
  if(path === "#/seller" && S.sellerTab === "finance") setupExport();
}
function renderAll(){ renderChrome(); renderView(); }

/* events */
document.addEventListener("click", (e) => {
  const el = e.target;
  const add = el.closest("[data-add]");
  if(add){ addToCart(add.getAttribute("data-add")); return; }
  const why = el.closest("[data-why]");
  if(why){ whyDialog(why.getAttribute("data-why")); return; }
  const qty = el.closest("[data-qty]");
  if(qty){
    const [id, d] = qty.getAttribute("data-qty").split(":");
    const line = S.cart.find(c => c.id === id);
    if(line){ line.qty = Math.max(1, line.qty + Number(d)); save(); renderAll(); }
    return;
  }
  const del = el.closest("[data-del]");
  if(del){ S.cart = S.cart.filter(c => c.id !== del.getAttribute("data-del")); save(); renderAll(); return; }
  const act = el.closest("[data-act]");
  if(act){ actOn(act.getAttribute("data-act")); return; }
  const tab = el.closest("[data-tab]");
  if(tab){ S.sellerTab = tab.getAttribute("data-tab"); save(); renderAll(); return; }
  const tg = el.closest("[data-toggle]");
  if(tg){
    const id = tg.getAttribute("data-toggle");
    S.unpublished = S.unpublished.includes(id) ? S.unpublished.filter(x => x !== id) : S.unpublished.concat(id);
    save(); renderAll(); return;
  }
  if(el.closest("#addProduct")){ addProductDialog(); return; }
  if(el.closest("#resetFilters")){ S.filters = defaultState().filters; S.q = ""; save(); renderAll(); return; }
  if(el.closest("#resetDemo")){
    const lang = S.lang; S = defaultState(); S.lang = lang; seedDemo(); S.seeded = true; save();
    location.hash = "#/"; renderAll(); return;
  }
});
document.addEventListener("change", (e) => {
  const f = e.target.closest("[data-f]");
  if(f){
    const key = f.getAttribute("data-f");
    S.filters[key] = f.type === "checkbox" ? f.checked : f.value;
    save(); renderView(); return;
  }
  if(e.target.id === "city"){ S.city = e.target.value; save(); renderAll(); return; }
});
document.addEventListener("input", (e) => {
  if(e.target.id === "fsPrice" || e.target.id === "fsCat"){
    const price = Math.max(0, Number(document.getElementById("fsPrice").value) || 0);
    const cat = document.getElementById("fsCat").value;
    const sp = splitOf(price, 0, cat);
    const classic = Math.round(price * 0.70);
    document.getElementById("fsOut").innerHTML = barChart([
      {label:t("fs_here"), v:sp.sellerGets, text:money(sp.sellerGets), hl:true},
      {label:t("fs_classic"), v:classic, text:money(classic)}
    ], {note:t("fs_classic_note")});
  }
});
document.addEventListener("submit", (e) => {
  if(e.target.id === "searchForm"){
    e.preventDefault();
    S.q = document.getElementById("q").value.trim();
    save();
    if(currentRoute() !== "#/catalog") location.hash = "#/catalog"; else renderAll();
    return;
  }
  if(e.target.id === "checkoutForm"){
    e.preventDefault();
    const form = {
      name:document.getElementById("ckName").value.trim(),
      phone:document.getElementById("ckPhone").value.trim(),
      city:document.getElementById("ckCity").value,
      addr:document.getElementById("ckAddr").value.trim(),
      pay:(document.querySelector('input[name="pay"]:checked') || {}).value || "card",
      settle:(document.querySelector('input[name="settle"]:checked') || {}).value || "hold"
    };
    S.city = form.city; save();
    createOrder(form);
  }
});
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  S.lang = b.dataset.lang; save(); renderAll();
}));
window.addEventListener("hashchange", () => { renderAll(); window.scrollTo({top:0, behavior:"instant"}); });

/* boot */
load();
renderAll();
</script>
