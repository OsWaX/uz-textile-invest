# =============================================================================
#  Развёртывание портала Проектного офиса.
#  Перед запуском: cp .env.example .env и заполните SESSION_SECRET и ADMIN_PASSWORD.
#  Запуск:         docker compose up -d
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: uz-textile-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Tashkent
      POSTGRES_DB: ${POSTGRES_DB:-uz_textile_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  portal:
    build: .
    image: uz-textile-portal:1.0.0
    container_name: uz-textile-portal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
      DATABASE_URL: postgres://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-uz_textile_portal}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8081}:3000"
    volumes:
      - portal-uploads:/app/data/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ежедневное резервное копирование базы данных и вложений (раздел 11 ТЗ).
  backup:
    image: postgres:16-alpine
    container_name: uz-textile-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - portal-uploads:/uploads:ro
      - ./backups:/backups
    command: >
      sh -c "while true; do
               STAMP=$$(date +%Y-%m-%d_%H%M);
               PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} -Fc -f /backups/portal-$$STAMP.dump;
               tar -czf /backups/uploads-$$STAMP.tar.gz -C /uploads .;
               find /backups -name 'portal-*.dump' -mtime +30 -delete;
               find /backups -name 'uploads-*.tar.gz' -mtime +30 -delete;
               sleep 86400;
             done"

volumes:
  postgres-data:
  portal-uploads:
