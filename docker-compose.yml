# =============================================================================
#  Развёртывание портала Проектного офиса.
#  Перед запуском: cp .env.example .env и заполните SESSION_SECRET и ADMIN_PASSWORD.
#  Запуск:         docker compose up -d
# =============================================================================
services:
  portal:
    build: .
    image: uz-textile-portal:1.0.0
    container_name: uz-textile-portal
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TZ: Asia/Tashkent
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - portal-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ежедневное резервное копирование базы данных и вложений (раздел 11 ТЗ).
  backup:
    image: alpine:3.20
    container_name: uz-textile-backup
    restart: unless-stopped
    depends_on:
      - portal
    volumes:
      - portal-data:/data:ro
      - ./backups:/backups
    command: >
      sh -c "apk add --no-cache sqlite tar >/dev/null &&
             while true; do
               STAMP=$$(date +%Y-%m-%d_%H%M);
               sqlite3 /data/portal.db \".backup '/backups/portal-$$STAMP.db'\";
               tar -czf /backups/uploads-$$STAMP.tar.gz -C /data uploads;
               find /backups -name 'portal-*.db' -mtime +30 -delete;
               find /backups -name 'uploads-*.tar.gz' -mtime +30 -delete;
               sleep 86400;
             done"

volumes:
  portal-data:
