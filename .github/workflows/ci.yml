name: Проверки

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: Тесты и проверка модулей
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: uz_textile_portal_test
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d uz_textile_portal_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://portal:portal@127.0.0.1:5432/uz_textile_portal_test
    steps:
      - uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Установка зависимостей
        run: npm install

      - name: Проверка синтаксиса клиентских модулей
        run: node --experimental-vm-modules scripts/check-frontend.js

      - name: Приёмочные испытания, безопасность и модульные тесты
        run: npm test

      - name: Проверка сборки образа
        run: docker build -t uz-textile-portal:ci .
